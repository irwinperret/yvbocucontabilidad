name: Add Excel-style selection to IPA monthly tables
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-excel-selection-ipa.yml'
      - 'src/components/excel-cell-selection.ts'
      - 'src/routes/_authenticated/resumen-ejecutivo-mensual.tsx'
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message != 'Add Excel-style selection to IPA monthly tables'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add selection behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/resumen-ejecutivo-mensual.tsx')
          s = p.read_text()

          imp = 'import { useExcelCellSelection } from "@/components/excel-cell-selection";\n'
          if imp not in s:
              marker = 'import { useUsdView, mensualView } from "@/lib/usd-view-context";\n'
              if marker not in s: raise SystemExit('Import marker not found')
              s = s.replace(marker, marker + imp, 1)

          marker = '  const autorizado = !!user?.email && PERMITIDOS.includes(user.email.toLowerCase());\n'
          hooks = '''  const categoriasComparativo = CATEGORIAS.filter((cat) => comparativoMensual.some((c) => Math.abs(c.t[cat]) > 0.009));
  const valoresComparativoSeleccion = useMemo(() => [
    ...categoriasComparativo.map((cat) => comparativoMensual.map((c) => c.t[cat])),
    comparativoMensual.map((c) => c.utilidad),
  ], [categoriasComparativo, comparativoMensual]);
  const valoresGpSeleccion = useMemo(() => desglose.flatMap((g) => [g.subtotal, ...g.items.map((i) => i.total)]).map((v) => [v]), [desglose]);
  const seleccionComparativo = useExcelCellSelection(valoresComparativoSeleccion);
  const seleccionGp = useExcelCellSelection(valoresGpSeleccion);

'''
          if 'const seleccionComparativo = useExcelCellSelection' not in s:
              if marker not in s: raise SystemExit('Authorization marker not found')
              s = s.replace(marker, hooks + marker, 1)

          # Use the stable filtered category list in the monthly table.
          old = 'CATEGORIAS.filter((cat) => comparativoMensual.some((c) => Math.abs(c.t[cat]) > 0.009)).map((cat) => ('
          if old in s:
              s = s.replace(old, 'categoriasComparativo.map((cat) => (', 1)

          # Monthly comparison numeric cells.
          old = '''                    <td key={c} className="py-1.5 px-2 text-right mono print:py-0 print:px-0.5">{fmtUsd(c.t[cat])}</td>'''
          new = '''                    <td
                      key={c}
                      onMouseDown={seleccionComparativo.startSelection(r, c)}
                      onMouseEnter={seleccionComparativo.overSelection(r, c)}
                      className={`py-1.5 px-2 text-right mono print:py-0 print:px-0.5 cursor-cell select-none ${seleccionComparativo.isSelected(r, c) ? "bg-primary/15 outline outline-1 outline-primary/40" : ""}`}
                    >{fmtUsd(c.t[cat])}</td>'''
          if old not in s: raise SystemExit('Monthly numeric cell not found')
          s = s.replace(old, new, 1)

          old = '''                  <td key={c.mesLabel} className={`py-2 px-2 text-right mono font-bold print:py-0.5 print:px-0.5 ${c.utilidad < 0 ? "text-destructive" : "text-green-600"}`}>
                    {fmtUsd(c.utilidad)}
                  </td>'''
          new = '''                  <td
                    key={c.mesLabel}
                    onMouseDown={seleccionComparativo.startSelection(r, c + 0)}
                    onMouseEnter={seleccionComparativo.overSelection(r, c + 0)}
                    className={`py-2 px-2 text-right mono font-bold print:py-0.5 print:px-0.5 cursor-cell select-none ${c.utilidad < 0 ? "text-destructive" : "text-green-600"} ${seleccionComparativo.isSelected(r, c + 0) ? "bg-primary/15 outline outline-1 outline-primary/40" : ""}`}
                  >
                    {fmtUsd(c.utilidad)}
                  </td>'''
          # This replacement is intentionally not used; utility is after all months, so handle below.
          # Restore correct utility-column coordinates by replacing the exact utility block separately.
          old_util = '''                {comparativoMensual.map((c) => (
                  <td key={c.mesLabel} className={`py-2 px-2 text-right mono font-bold print:py-0.5 print:px-0.5 ${c.utilidad < 0 ? "text-destructive" : "text-green-600"}`}>
                    {fmtUsd(c.utilidad)}
                  </td>
                ))}'''
          new_util = '''                {comparativoMensual.map((c, ci) => (
                  <td
                    key={c.mesLabel}
                    onMouseDown={seleccionComparativo.startSelection(categoriasComparativo.length, ci)}
                    onMouseEnter={seleccionComparativo.overSelection(categoriasComparativo.length, ci)}
                    className={`py-2 px-2 text-right mono font-bold print:py-0.5 print:px-0.5 cursor-cell select-none ${c.utilidad < 0 ? "text-destructive" : "text-green-600"} ${seleccionComparativo.isSelected(categoriasComparativo.length, ci) ? "bg-primary/15 outline outline-1 outline-primary/40" : ""}`}
                  >
                    {fmtUsd(c.utilidad)}
                  </td>
                ))}'''
          if old_util not in s: raise SystemExit('Utility row block not found')
          s = s.replace(old_util, new_util, 1)

          # Add a selection summary after the monthly table card.
          marker = '''      </Card>
      {/* b) Desglose mensual de G&P */}'''
          summary = '''      </Card>
      {seleccionComparativo.selection.count > 0 && (
        <div className="flex justify-end -mt-4">
          <div className="bg-foreground text-background text-xs rounded-md shadow-lg px-4 py-2 flex items-center gap-4 mono">
            <span>Celdas: <b>{seleccionComparativo.selection.count}</b></span>
            <span>Promedio: <b>{fmtUsd(seleccionComparativo.selection.average)}</b></span>
            <span>Suma: <b>{fmtUsd(seleccionComparativo.selection.suma)}</b></span>
          </div>
        </div>
      )}
      {/* b) Desglose mensual de G&P */}'''
          if marker not in s: raise SystemExit('Monthly card marker not found')
          s = s.replace(marker, summary, 1)

          # G&P table numeric cells. Row index is maintained by a counter in render.
          old = '''          <table className="w-full text-sm print:text-[7px]">
            <tbody>
              {desglose.map((g) => (
                <Fragment key={g.cat}>'''
          new = '''          <table className="w-full text-sm print:text-[7px]">
            <tbody>
              {desglose.map((g, gi) => {
                const rowBase = desglose.slice(0, gi).reduce((n, x) => n + 1 + x.items.length, 0);
                return (
                <Fragment key={g.cat}>'''
          if old not in s: raise SystemExit('GP table start not found')
          s = s.replace(old, new, 1)

          old = '''                    <td className="py-1.5 px-2 text-right mono font-semibold print:py-0 print:px-1">{fmtUsd(g.subtotal)}</td>'''
          new = '''                    <td
                      onMouseDown={seleccionGp.startSelection(rowBase, 0)}
                      onMouseEnter={seleccionGp.overSelection(rowBase, 0)}
                      className={`py-1.5 px-2 text-right mono font-semibold print:py-0 print:px-1 cursor-cell select-none ${seleccionGp.isSelected(rowBase, 0) ? "bg-primary/15 outline outline-1 outline-primary/40" : ""}`}
                    >{fmtUsd(g.subtotal)}</td>'''
          if old not in s: raise SystemExit('GP subtotal cell not found')
          s = s.replace(old, new, 1)

          old = '''                  {g.items.map((i) => (
                    <tr key={`${g.cat}-${i.codigo}`} className="border-b last:border-0">
                      <td className="py-1 px-2 pl-6 text-muted-foreground print:py-0 print:px-1">{i.codigo} · {i.nombre}</td>
                      <td className="py-1 px-2 text-right mono print:py-0 print:px-1">{fmtUsd(i.total)}</td>
                    </tr>
                  ))}'''
          new = '''                  {g.items.map((i, ii) => (
                    <tr key={`${g.cat}-${i.codigo}`} className="border-b last:border-0">
                      <td className="py-1 px-2 pl-6 text-muted-foreground print:py-0 print:px-1">{i.codigo} · {i.nombre}</td>
                      <td
                        onMouseDown={seleccionGp.startSelection(rowBase + 1 + ii, 0)}
                        onMouseEnter={seleccionGp.overSelection(rowBase + 1 + ii, 0)}
                        className={`py-1 px-2 text-right mono print:py-0 print:px-1 cursor-cell select-none ${seleccionGp.isSelected(rowBase + 1 + ii, 0) ? "bg-primary/15 outline outline-1 outline-primary/40" : ""}`}
                      >{fmtUsd(i.total)}</td>
                    </tr>
                  ))}'''
          if old not in s: raise SystemExit('GP item cells not found')
          s = s.replace(old, new, 1)

          # Close the map callback after the Fragment.
          old = '''                </Fragment>
              ))}
            </tbody>'''
          new = '''                </Fragment>
                );
              })}
            </tbody>'''
          if old not in s: raise SystemExit('GP map close not found')
          s = s.replace(old, new, 1)

          # Add selection summary after G&P card.
          marker = '''      </Card>

      <Card className="print:break-inside-avoid">
        <CardHeader className="print:p-1.5"><CardTitle className="text-lg print:text-[9px]">Cuentas por pagar'''
          summary = '''      </Card>
      {seleccionGp.selection.count > 0 && (
        <div className="flex justify-end -mt-4">
          <div className="bg-foreground text-background text-xs rounded-md shadow-lg px-4 py-2 flex items-center gap-4 mono">
            <span>Celdas: <b>{seleccionGp.selection.count}</b></span>
            <span>Promedio: <b>{fmtUsd(seleccionGp.selection.average)}</b></span>
            <span>Suma: <b>{fmtUsd(seleccionGp.selection.suma)}</b></span>
          </div>
        </div>
      )}

      <Card className="print:break-inside-avoid">
        <CardHeader className="print:p-1.5"><CardTitle className="text-lg print:text-[9px]">Cuentas por pagar'''
          if marker not in s: raise SystemExit('GP summary marker not found')
          s = s.replace(marker, summary, 1)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/resumen-ejecutivo-mensual.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Add Excel-style selection to IPA monthly tables'
          git push
          rm -f .github/workflows/add-excel-selection-ipa.yml
          git add .github/workflows/add-excel-selection-ipa.yml
          git commit -m 'Remove temporary IPA selection workflow'
          git push
