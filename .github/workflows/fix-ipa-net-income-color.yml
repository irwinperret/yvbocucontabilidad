name: Fix IPA net income chart color

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix IPA net income chart color'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update chart color
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/resumen-ejecutivo-mensual.tsx')
          s = p.read_text()
          old = '<Line type="monotone" dataKey="utilidadNetaPct" name="Utilidad neta %" stroke="#111827" strokeWidth={2} dot={{ r: 3 }} connectNulls />'
          new = '<Line type="monotone" dataKey="utilidadNetaPct" name="Utilidad neta %" stroke="#0066FF" strokeWidth={3} dot={{ r: 3, fill: "#0066FF", stroke: "#0066FF" }} connectNulls />'
          if old not in s:
              raise SystemExit('Target line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit change and remove temporary workflow
        run: |
          rm .github/workflows/fix-ipa-net-income-color.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/resumen-ejecutivo-mensual.tsx .github/workflows/fix-ipa-net-income-color.yml
          git commit -m "Fix IPA net income chart color"
          git push
