name: Update CxP top suppliers to 10
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update top supplier count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/pagar-cxp.tsx')
          s = p.read_text()
          replacements = [
            ('const top5Proveedores = useMemo(() => {', 'const top10Proveedores = useMemo(() => {'),
            ('.slice(0, 5);', '.slice(0, 10);'),
            ('{top5Proveedores.length > 0}', '{top10Proveedores.length > 0}'),
            ('Top 5 proveedores con más CxP pendiente', 'Top 10 proveedores con más CxP pendiente'),
            ('className="grid gap-3 md:grid-cols-5"', 'className="grid gap-3 md:grid-cols-5 lg:grid-cols-10"'),
            ('{top5Proveedores.map((p) => (', '{top10Proveedores.map((p) => ('),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of: {old!r}, found {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/pagar-cxp.tsx
          git commit -m 'Show top 10 suppliers with pending CxP' || exit 0
          git push
          rm -f .github/workflows/update-top-cxp-10.yml
          git add .github/workflows/update-top-cxp-10.yml
          git commit -m 'Remove temporary CxP top 10 workflow'
          git push
