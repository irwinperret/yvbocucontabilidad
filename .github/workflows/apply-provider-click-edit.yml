name: Apply provider reconciliation click editing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/proveedores/$id.tsx')
          s = p.read_text()
          marker = 'factura-detalle-dialog'
          if marker not in s:
              s = s.replace('import { EditDialog } from "@/components/transaccion-edit-dialog";', 'import { EditDialog } from "@/components/transaccion-edit-dialog";\nimport { FacturaDetalleDialog } from "@/components/factura-detalle-dialog";')
              s = s.replace('  const [editandoMov, setEditandoMov] = useState<any | null>(null);', '  const [editandoMov, setEditandoMov] = useState<any | null>(null);\n  const [editandoFactura, setEditandoFactura] = useState<any | null>(null);')
              s = s.replace('  disabled?: boolean;\n}) {', '  disabled?: boolean;\n  onEditar?: () => void;\n}) {', 1)
              s = s.replace('  disabled,\n}: {\n  cxp: any;', '  disabled,\n  onEditar,\n}: {\n  cxp: any;', 1)
              s = s.replace('      className={`flex items-center gap-2 rounded-md border bg-card px-2 py-1 text-xs ${isDragging ? "opacity-50" : ""}`}\n    >', '      className={`flex items-center gap-2 rounded-md border bg-card px-2 py-1 text-xs ${isDragging ? "opacity-50" : ""} ${onEditar ? "cursor-pointer hover:bg-muted/50" : ""}`}\n      onClick={(e) => { if (onEditar && !(e.target as HTMLElement).closest("button")) onEditar(); }}\n      title={onEditar ? "Abrir y editar factura" : undefined}\n    >', 1)
              s = s.replace('                            onQuitar={() => moverFactura(c.id, null)}\n                          />', '                            onQuitar={() => moverFactura(c.id, null)}\n                            onEditar={() => setEditandoFactura(c)}\n                          />', 1)
              s = s.replace('                    <FacturaChip cxp={c} emision={emisionDeCxp(c)} disabled={busy} />', '                    <FacturaChip cxp={c} emision={emisionDeCxp(c)} disabled={busy} onEditar={() => setEditandoFactura(c)} />', 1)
              old = '<Zona key={mv.id} id={`mov:${mv.id}`} className="border rounded-md p-3">'
              new = '<Zona key={mv.id} id={`mov:${mv.id}`} className="border rounded-md p-3 cursor-pointer hover:bg-muted/20" onClick={() => setEditandoMov(mv)}>'
              # Zona does not currently accept onClick, so add a click prop to the component.
              s = s.replace('function Zona({ id, children, className }: { id: string; children: React.ReactNode; className?: string }) {', 'function Zona({ id, children, className, onClick }: { id: string; children: React.ReactNode; className?: string; onClick?: () => void }) {')
              s = s.replace('    <div ref={setNodeRef} className={`${className ?? ""} ${isOver ? "ring-2 ring-primary rounded-md" : ""}`}>', '    <div ref={setNodeRef} onClick={onClick} className={`${className ?? ""} ${isOver ? "ring-2 ring-primary rounded-md" : ""}`}>', 1)
              s = s.replace(old, new, 1)
              # Prevent controls inside the movement card from opening the edit dialog.
              s = s.replace('<div className="flex flex-wrap items-center gap-2">\n                        <Badge', '<div className="flex flex-wrap items-center gap-2" onClick={(e) => e.stopPropagation()}>\n                        <Badge', 1)
              s = s.replace('<div className="mt-2 space-y-1">', '<div className="mt-2 space-y-1" onClick={(e) => e.stopPropagation()}>', 1)
              s = s.replace('      {editandoMov && (\n        <EditDialog', '      {editandoFactura && (\n        <FacturaDetalleDialog\n          factura={editandoFactura}\n          onClose={() => setEditandoFactura(null)}\n          onSaved={async () => { setEditandoFactura(null); await refrescar(); }}\n        />\n      )}\n      {editandoMov && (\n        <EditDialog', 1)
              p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          grep -q 'factura-detalle-dialog' 'src/routes/_authenticated/proveedores/$id.tsx'
          grep -q 'editandoFactura' 'src/routes/_authenticated/proveedores/$id.tsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/_authenticated/proveedores/$id.tsx'
          git rm '.github/workflows/apply-provider-click-edit.yml'
          git commit -m 'Add click-to-edit for provider reconciliation items'
          git push
