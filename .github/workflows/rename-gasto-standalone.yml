name: Rename Gasto Directo label
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace user-facing labels
        shell: bash
        run: |
          set -e
          # Keep the internal state key `gasto_directo` unchanged; only rename
          # the user-facing wording across the bank-movement/conciliation UI.
          grep -RIl --exclude-dir=node_modules --exclude-dir=.git 'Gasto directo' src | while read -r f; do
            sed -i 's/Gasto directo (sin factura)/Gasto Stand-Alone (sin factura)/g; s/Gasto directo/Gasto Stand-Alone/g' "$f"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Rename Gasto Directo to Gasto Stand-Alone' || exit 0
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/rename-gasto-standalone.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rename-gasto-standalone.yml
          git commit -m 'Remove temporary rename workflow' || exit 0
          git push
