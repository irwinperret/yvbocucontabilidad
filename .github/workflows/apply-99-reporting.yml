name: Apply 99 POR DETERMINAR reporting change
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # G&P: include account 99 in operating expenses in both monthly and YTD views.
          p = Path('src/routes/_authenticated/gyp.tsx')
          s = p.read_text()
          old = 'const op = buildGrupos(cuentas, (c) => /^[3-6]\\./.test(c), rows, sumFn);'
          new = 'const op = buildGrupos(cuentas, (c) => /^[3-6]\\./.test(c) || c === "99", rows, sumFn);'
          n = s.count(old)
          if n != 2:
              raise SystemExit(f'gyp.tsx: expected 2 operating filters, found {n}')
          p.write_text(s.replace(old, new))

          # FC: account 99 is an operating expense for EBITDA purposes.
          p = Path('src/routes/_authenticated/fc.tsx')
          s = p.read_text()
          old = 'const costosVariables = r.filter((x) => x.cuenta_codigo.startsWith("4.") && x.mes === mes).reduce((s, x) => s + Number(x.base_usd || 0), 0);'
          new = 'const costosVariables = r.filter((x) => (x.cuenta_codigo.startsWith("4.") || x.cuenta_codigo === "99") && x.mes === mes).reduce((s, x) => s + Number(x.base_usd || 0), 0);'
          if s.count(old) != 1:
              raise SystemExit('fc.tsx: expected cost variable filter not found exactly once')
          p.write_text(s.replace(old, new))

          # Bank movements: 99 still appears as POR DETERMINAR, but its impact is explicitly included.
          p = Path('src/routes/_authenticated/movimientos-bancarios.tsx')
          s = p.read_text()
          old = 'sub={`${resumen.porDeterminar} movimiento(s) · no entran a G&P/FC hasta reclasificarse`}'
          new = 'sub={`${resumen.porDeterminar} movimiento(s) · entran a G&P/FC aun sin reclasificarse`}'
          if s.count(old) != 1:
              raise SystemExit('movimientos-bancarios.tsx: KPI text not found exactly once')
          s = s.replace(old, new)
          old = 'f.estado === "no_aplica" && f.claseNoAplica === "no_contable" ? "No afecta G&P/FC" : "Afecta G&P y FC",'
          new = 'f.estado === "no_aplica" && f.claseNoAplica === "no_contable" && f.mov.cuenta_codigo !== "99" ? "No afecta G&P/FC" : "Afecta G&P y FC",'
          if s.count(old) != 1:
              raise SystemExit('movimientos-bancarios.tsx: impact label not found exactly once')
          p.write_text(s.replace(old, new))
          PY

          # Make account 99 eligible for both reports. Keep it labeled POR DETERMINAR.
          cat > supabase/migrations/$(date +%Y%m%d%H%M%S)_include_99_in_gyp_fc.sql <<'SQL'
          UPDATE public.plan_de_cuentas
          SET afecta_gyp = true,
              afecta_fc = true
          WHERE codigo = '99';
          SQL

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/gyp.tsx src/routes/_authenticated/fc.tsx src/routes/_authenticated/movimientos-bancarios.tsx supabase/migrations
          git commit -m 'Include account 99 in G&P and cash flow' || exit 0
          git push

          # Remove this one-shot workflow after applying the change.
          rm -f .github/workflows/apply-99-reporting.yml
          git add .github/workflows/apply-99-reporting.yml
          git commit -m 'Remove temporary 99 reporting workflow'
          git push
