name: Fix IPA print graph order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix IPA print graph order'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make print layout sortable
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles.css')
          s = p.read_text()
          target = '[class~="space-y-6"][class~="print:space-y-1.5"] > *:first-child { order: 1; }'
          replacement = '''[class~="space-y-6"][class~="print:space-y-1.5"] {
            display: flex !important;
            flex-direction: column !important;
          }

          [class~="space-y-6"][class~="print:space-y-1.5"] > *:first-child { order: 1; }'''
          if target not in s:
              raise SystemExit('Print order anchor not found')
          p.write_text(s.replace(target, replacement, 1))
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-print-graph-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css .github/workflows/fix-print-graph-order.yml
          git commit -m "Fix IPA print graph order"
          git push
