name: Format IPA print report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-ipa-print.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Improve IPA print layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/styles.css')
          text = path.read_text(encoding='utf-8')

          marker = '/* IPA Mensual — diseño específico para impresión */'
          if marker not in text:
              text += '''\n\n/* IPA Mensual — diseño específico para impresión */\n@media print {\n  /* The report root has a distinctive combination of utility classes.\n     Keep the interactive screen layout untouched and only reorder/compact\n     the report when printing. */\n  [class~="space-y-6"][class~="print:space-y-1.5"] {\n    display: flex !important;\n    flex-direction: column !important;\n    gap: 5mm !important;\n  }\n\n  [class~="space-y-6"][class~="print:space-y-1.5"] > [class~="bg-amber-50"] {\n    order: 2;\n  }\n\n  [class~="space-y-6"][class~="print:space-y-1.5"] > :has(table thead) {\n    order: 5;\n  }\n\n  [class~="space-y-6"][class~="print:space-y-1.5"] > :has(table tbody):not(:has(table thead)) {\n    order: 6;\n  }\n\n  [class~="space-y-6"][class~="print:space-y-1.5"] > [class~="lg:grid-cols-2"] {\n    order: 7;\n  }\n\n  [class~="space-y-6"][class~="print:space-y-1.5"] > [class~="md:grid-cols-4"] {\n    order: 4;\n  }\n\n  [class~="space-y-6"][class~="print:space-y-1.5"] > *:first-child {\n    order: 1;\n  }\n\n  /* Analysis immediately follows the title. */\n  [class~="space-y-6"][class~="print:space-y-1.5"] > .rounded-xl.border.bg-card {\n    order: 3;\n  }\n\n  /* Selection summaries are useful on screen but should never appear in the PDF. */\n  [class~="space-y-6"][class~="print:space-y-1.5"] > .flex.justify-end {\n    display: none !important;\n  }\n\n  /* Give the printed tables a clean report appearance. */\n  [class~="space-y-6"][class~="print:space-y-1.5"] table {\n    width: 100% !important;\n    border-collapse: collapse !important;\n  }\n\n  [class~="space-y-6"][class~="print:space-y-1.5"] thead {\n    display: table-header-group;\n  }\n\n  [class~="space-y-6"][class~="print:space-y-1.5"] tr {\n    break-inside: avoid;\n    page-break-inside: avoid;\n  }\n\n  [class~="space-y-6"][class~="print:space-y-1.5"] th {\n    border-bottom: 1px solid #888 !important;\n  }\n\n  /* Charts get a little more vertical room in the PDF while staying compact. */\n  [class~="space-y-6"][class~="print:space-y-1.5"] > [class~="lg:grid-cols-2"] > * {\n    break-inside: avoid;\n    page-break-inside: avoid;\n  }\n\n  /* Avoid horizontal scrolling containers clipping printed tables. */\n  [class~="space-y-6"][class~="print:space-y-1.5"] .overflow-x-auto {\n    overflow: visible !important;\n  }\n\n  /* Keep each major section together whenever the browser can do so. */\n  [class~="space-y-6"][class~="print:space-y-1.5"] > :has(table) {\n    break-inside: auto;\n    page-break-inside: auto;\n  }\n}\n'''
              path.write_text(text, encoding='utf-8')

      - name: Commit report formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css
          git rm .github/workflows/format-ipa-print.yml
          git commit -m "Improve IPA monthly report print layout"
          git push
