name: Set reports to include off-balance by default
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['src/routes/_authenticated/gyp.tsx', 'src/routes/_authenticated/fc.tsx']:
              p = Path(name)
              s = p.read_text()
              old = 'const [incluirOff, setIncluirOff] = useState(false);'
              new = 'const [incluirOff, setIncluirOff] = useState(true);'
              if s.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one default off-balance state, found {s.count(old)}')
              p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/gyp.tsx src/routes/_authenticated/fc.tsx
          git commit -m 'Default G&P and cash flow to include off-balance'
          git push
          rm -f .github/workflows/default-off-balance.yml
          git add .github/workflows/default-off-balance.yml
          git commit -m 'Remove temporary off-balance workflow'
          git push
