name: Update IPA print analysis font
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update print layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/resumen-ejecutivo-mensual.tsx')
          s = p.read_text()
          old = 'print:text-[10px]">Análisis del mes'
          new = 'print:text-[12.5px]">Análisis del mes'
          if old not in s:
              raise SystemExit('analysis title pattern not found')
          s = s.replace(old, new, 1)
          old = 'print:space-y-0.5 print:text-[8px] print:leading-snug'
          new = 'print:space-y-1 print:text-[10px] print:leading-snug'
          if old not in s:
              raise SystemExit('analysis body pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/resumen-ejecutivo-mensual.tsx
          git diff --cached --quiet || git commit -m 'Increase IPA print analysis font size'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/update-ipa-print-analysis.yml
          git commit -m 'Remove temporary IPA print workflow'
          git push
