name: Adjust printable analysis font
on:
  push:
    paths:
      - '.github/workflows/adjust-print-analysis-font.yml'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase print analysis fonts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/resumen-ejecutivo-mensual.tsx')
          s = p.read_text()
          old = 'print:text-[12.5px]">Análisis del mes</CardTitle>'
          new = 'print:text-[15.625px]">Análisis del mes</CardTitle>'
          s = s.replace(old, new, 1)
          old = 'print:text-[10px] print:leading-snug">'
          new = 'print:text-[12.5px] print:leading-snug">'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/resumen-ejecutivo-mensual.tsx
          git diff --cached --quiet || git commit -m 'Increase printable analysis section font'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/adjust-print-analysis-font.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary print font workflow'
          git push
