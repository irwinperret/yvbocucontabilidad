name: One-time provider UI change

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested provider UI changes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/routes/_authenticated/proveedores/$id.tsx')
          text = path.read_text(encoding='utf-8')

          old_title = 'Sin aplicar (USD BCV)'
          new_title = 'Saldo pendiente de movimientos (USD BCV)'
          if old_title not in text:
              raise SystemExit(f'Expected title not found: {old_title}')
          text = text.replace(old_title, new_title, 1)

          pattern = re.compile(
              r'''        <Card\n          className=\{`cursor-pointer transition-colors \$\{focusResumen === "movs-sin-factura" \? "ring-2 ring-primary" : ""\}`}\n          onClick=\{\(\) => onResumenClick\("movs-sin-factura"\)\}\n        >\n          <CardContent className="p-3">\n            <div className="text-xs text-muted-foreground">Movimientos sin factura \(USD BCV\)</div>\n            <div className="text-lg font-semibold mono">\{fmtUsd\(totalUsdBcvMovsSinFactura\)\}</div>\n          </CardContent>\n        </Card>''',
              re.MULTILINE,
          )

          text2, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected Movimientos sin factura card exactly once, found {count}')

          path.write_text(text2, encoding='utf-8')
          print('Applied requested provider UI changes.')

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-provider-ui-change.yml
          git add src/routes/_authenticated/proveedores/'$id'.tsx .github/workflows/one-time-provider-ui-change.yml
          git commit -m "Update provider reconciliation summary cards"
          git push origin main
